version: "3.9"

services:
  postgres:
    image: pgvector/pgvector:pg16
    container_name: icesi_postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: icesi
      POSTGRES_PASSWORD: icesi_pass
      POSTGRES_DB: icesi_ia
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U icesi -d icesi_ia"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: icesi_redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    command: redis-server --maxmemory 256mb --maxmemory-policy allkeys-lru
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  orchestrator:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: icesi_orchestrator
    restart: unless-stopped
    ports:
      - "8000:8000"
    environment:
      - DATABASE_URL=postgresql://icesi:icesi_pass@postgres:5432/icesi_ia
      - REDIS_URL=redis://redis:6379/0
    env_file:
      - .env
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      - ./icesi-kb:/app/icesi-kb

  dashboard:
    build:
      context: .
      dockerfile: Dockerfile.dashboard
    container_name: icesi_dashboard
    restart: unless-stopped
    ports:
      - "8501:8501"
    environment:
      - DATABASE_URL=postgresql://icesi:icesi_pass@postgres:5432/icesi_ia
    depends_on:
      - postgres
    command: streamlit run dashboard/app.py --server.port=8501 --server.address=0.0.0.0

volumes:
  pgdata:
